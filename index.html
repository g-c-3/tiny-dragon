<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiny chess</title>
<style>
  body { margin:0; background:#000; }
  #dosbox { width:100vw; height:100vh; }
</style>
</head>
<body>
<div id="dosbox"></div>
<script src="https://js-dos.com/cdn/js-dos-api.js"></script>
<script>
  var dosbox = new Dosbox({
    id: "dosbox",
    onload: function (dosbox) {
      dosbox.run("tiny.com");
    }
  });
</script>
</body>
</html>
