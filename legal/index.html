<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiny chess (legal)</title>
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<style>
  html,body { margin:0; background:#000; }
  #dos { width:100vw; height:100vh; }
  #credit {
    position:fixed;
    bottom:6px;
    right:10px;
    color:#666;
    font-family:monospace;
    font-size:11px;
    z-index:10;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="dos"></div>
<div id="credit">&copy; 2026 Gokul Chandar &mdash; legality-checking derivative</div>
<script>
  // Fetch tiny_legal.com fresh every time (cache-busted), so this page ALWAYS
  // reflects whatever is currently committed to the repo -- no separate
  // .jsdos bundle to remember to regenerate.
  fetch("tiny_legal.com?_=" + Date.now(), { cache: "no-store" })
    .then(r => r.arrayBuffer())
    .then(buf => {
      const bytes = new Uint8Array(buf);
      Dos(document.getElementById("dos"), {
        dosboxConf: `
[autoexec]
mount c .
c:
tiny_legal.com
`,
        initFs: [
          { path: "/tiny_legal.com", contents: bytes }
        ]
      });
    })
    .catch(err => {
      document.getElementById("dos").innerText =
        "Failed to load tiny_legal.com: " + err;
    });
</script>
</body>
</html>
